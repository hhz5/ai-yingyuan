<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影源 · 企业智能创作平台</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
/* ============================================================
   影源 AI 原型 · 设计系统
   ============================================================ */
:root{
  --nav-bg:#1c2636; --nav-bg-2:#222e42; --nav-text:#aeb8c9; --nav-active:#2557D6; --nav-hover:#2a3850;
  --primary:#2557D6; --primary-hover:#1d48b5; --primary-active:#183d9c; --primary-light:#eaf1fe; --primary-mid:#bcd2fb;
  --bg:#f3f5f9; --card:#ffffff; --border:#e3e7ef; --border-strong:#cfd6e2;
  --text:#1e2632; --text-2:#555f70; --text-3:#8b95a7;
  --success:#159947; --success-bg:#e8f6ec; --warn:#d97e06; --warn-bg:#fdf3e2; --danger:#d43026; --danger-bg:#fdecea;
  --radius:8px; --radius-lg:12px;
  --shadow-sm:0 1px 2px rgba(18,28,45,.05);
  --shadow:0 2px 6px rgba(18,28,45,.06), 0 8px 24px rgba(18,28,45,.06);
  --shadow-lg:0 8px 28px rgba(18,28,45,.16);
  --font:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;min-width:1180px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);outline:none;}
ul,ol{list-style:none;}
a{color:var(--primary);text-decoration:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#c6cddb;border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:#a9b3c6;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- 整体骨架 ---------- */
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:224px;flex-shrink:0;background:var(--nav-bg);color:var(--nav-text);display:flex;flex-direction:column;overflow:hidden;}
.brand{height:58px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.brand-logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3d73e8,#2557D6);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.brand-name{color:#fff;font-size:17px;font-weight:700;letter-spacing:2px;}
.brand-sub{font-size:10px;color:#7e8aa0;letter-spacing:1px;margin-top:1px;}
.nav-scroll{flex:1;overflow-y:auto;padding:10px 10px 20px;}
.nav-group-label{font-size:11px;color:#6b7689;padding:12px 10px 6px;letter-spacing:1px;}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:7px;color:var(--nav-text);font-size:14px;text-align:left;margin-bottom:2px;transition:background .15s,color .15s;position:relative;}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.nav-item:hover{background:var(--nav-hover);color:#dbe2ee;}
.nav-item.active{background:var(--nav-active);color:#fff;font-weight:500;}
.nav-sub{margin:2px 0 4px 0;}
.nav-sub .nav-item{padding-left:38px;font-size:13px;min-height:34px;}
.nav-sub .nav-item .x-dot{margin-left:auto;opacity:0;font-size:16px;color:#9aa6bb;padding:0 4px;border-radius:4px;}
.nav-sub .nav-item:hover .x-dot{opacity:1;}
.nav-sub .nav-item .x-dot:hover{background:rgba(255,255,255,.12);color:#fff;}
.side-foot{padding:10px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;color:#6b7689;flex-shrink:0;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:58px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 22px;flex-shrink:0;}
.topbar h1{font-size:16px;font-weight:700;}
.topbar .crumb{color:var(--text-3);font-size:13px;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.view{flex:1;overflow-y:auto;position:relative;}
.page{padding:24px 28px;max-width:1280px;margin:0 auto;}

/* ---------- 通用组件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 16px;border-radius:7px;font-size:14px;font-weight:500;border:1px solid var(--border-strong);background:#fff;color:var(--text-2);transition:all .15s;white-space:nowrap;}
.btn:hover{border-color:var(--primary);color:var(--primary);}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff;}
.btn-primary:active{background:var(--primary-active);}
.btn-danger{color:var(--danger);border-color:#f0b8b3;}
.btn-danger:hover{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn-disabled,.btn:disabled{background:#eef1f6;border-color:#eef1f6;color:#a6afc0;cursor:not-allowed;}
.btn-disabled:hover,.btn:disabled:hover{border-color:#eef1f6;color:#a6afc0;background:#eef1f6;}
.btn-sm{height:28px;padding:0 12px;font-size:13px;border-radius:6px;}
.btn-text{border:none;background:none;color:var(--primary);padding:2px 6px;height:auto;border-radius:4px;}
.btn-text:hover{background:var(--primary-light);}
.btn-text.danger{color:var(--danger);}
.btn-text.danger:hover{background:var(--danger-bg);}

.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:12px;background:var(--primary-light);color:var(--primary);}
.tag-gray{background:#f0f2f6;color:var(--text-2);}
.tag-green{background:var(--success-bg);color:var(--success);}
.tag-orange{background:var(--warn-bg);color:var(--warn);}
.tag-red{background:var(--danger-bg);color:var(--danger);}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
.section-head{display:flex;align-items:center;gap:10px;margin:22px 0 14px;}
.section-head h2{font-size:16px;font-weight:700;}
.section-head .more{margin-left:auto;}
.input,.textarea,.select{width:100%;border:1px solid var(--border-strong);border-radius:7px;padding:8px 11px;font-size:14px;background:#fff;transition:border-color .15s,box-shadow .15s;}
.input:focus,.textarea:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,87,214,.12);}
.textarea{resize:vertical;line-height:1.7;}
.field{margin-bottom:16px;}
.field-label{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px;}
.req{color:var(--danger);}
.field-hint{font-size:12px;color:var(--text-3);margin-top:5px;line-height:1.5;}
.char-count{font-size:12px;color:var(--text-3);text-align:right;margin-top:4px;}
.over-limit{color:var(--danger)!important;}

/* 开关 */
.switch{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0;}
.switch input{display:none;}
.switch .track{position:absolute;inset:0;background:#c9d0dd;border-radius:20px;transition:.2s;cursor:pointer;}
.switch .track::after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch input:checked + .track{background:var(--primary);}
.switch input:checked + .track::after{transform:translateX(17px);}

/* radio pill */
.radio-pills{display:flex;gap:8px;flex-wrap:wrap;}
.radio-pills label{position:relative;}
.radio-pills input{position:absolute;opacity:0;}
.radio-pills span{display:inline-flex;align-items:center;height:32px;padding:0 14px;border:1px solid var(--border-strong);border-radius:7px;cursor:pointer;font-size:13px;color:var(--text-2);background:#fff;transition:.15s;}
.radio-pills input:checked + span{border-color:var(--primary);background:var(--primary-light);color:var(--primary);font-weight:500;}
.radio-pills input:disabled + span{background:#f5f6f9;color:#b3bac8;cursor:not-allowed;}

/* ---------- 模态框 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(20,28,44,.45);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .18s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal{background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);animation:popIn .2s;display:flex;flex-direction:column;max-height:88vh;}
.modal-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
.modal-head h3{font-size:16px;font-weight:700;}
.modal-close{margin-left:auto;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-3);}
.modal-close:hover{background:#f0f2f6;color:var(--text);}
.modal-body{padding:20px;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;}

/* 确认弹窗 */
.confirm-box{width:380px;}
.confirm-body{display:flex;gap:14px;padding:24px 22px 18px;}
.confirm-icon{width:38px;height:38px;border-radius:50%;background:var(--danger-bg);color:var(--danger);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.confirm-icon svg{width:22px;height:22px;}
.confirm-text h4{font-size:15px;margin-bottom:5px;}
.confirm-text p{font-size:13px;color:var(--text-2);}

/* toast */
.toast-wrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:#fff;border:1px solid var(--border);border-left:3px solid var(--success);box-shadow:var(--shadow);padding:10px 18px;border-radius:8px;font-size:13.5px;display:flex;align-items:center;gap:8px;animation:popIn .2s;}
.toast.info{border-left-color:var(--primary);}
.toast.warn{border-left-color:var(--warn);}
.toast.error{border-left-color:var(--danger);}
.toast svg{width:16px;height:16px;color:var(--success);}
.toast.info svg{color:var(--primary);} .toast.warn svg{color:var(--warn);} .toast.error svg{color:var(--danger);}

/* loading 点 */
.dots-loading{display:inline-flex;gap:4px;align-items:center;}
.dots-loading i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:dotBlink 1.2s infinite;}
.dots-loading i:nth-child(2){animation-delay:.2s;} .dots-loading i:nth-child(3){animation-delay:.4s;}
@keyframes dotBlink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.spinner{width:16px;height:16px;border:2px solid rgba(37,87,214,.2);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 智体中心 ---------- */
.reco-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.reco-card{display:flex;gap:14px;padding:18px;cursor:pointer;transition:box-shadow .18s,transform .18s,border-color .18s;}
.reco-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--primary-mid);}
.agent-logo{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;font-weight:700;flex-shrink:0;letter-spacing:0;}
.reco-info h3{font-size:15px;margin-bottom:5px;display:flex;align-items:center;gap:8px;}
.reco-info p{font-size:12.5px;color:var(--text-2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.tab{padding:9px 15px;font-size:14px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.tab:hover{color:var(--primary);}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}
.agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.agent-card{padding:15px;display:flex;gap:12px;cursor:pointer;position:relative;transition:.15s;}
.agent-card:hover{box-shadow:var(--shadow);border-color:var(--primary-mid);}
.agent-card .agent-logo{width:40px;height:40px;font-size:16px;border-radius:10px;}
.agent-card h4{font-size:14px;margin-bottom:3px;display:flex;align-items:center;gap:7px;}
.agent-card p{font-size:12px;color:var(--text-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.agent-from{font-size:11px;color:var(--text-3);margin-top:7px;display:flex;align-items:center;gap:5px;}
.agent-ops{position:absolute;top:10px;right:10px;display:flex;gap:4px;opacity:0;transition:.15s;}
.agent-card:hover .agent-ops{opacity:1;}
.icon-btn{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-3);background:#f5f6f9;}
.icon-btn:hover{background:var(--primary-light);color:var(--primary);}
.icon-btn svg{width:14px;height:14px;}
.docs-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.doc-tpl{padding:13px 15px;display:flex;gap:11px;cursor:pointer;align-items:flex-start;}
.doc-tpl:hover{border-color:var(--primary-mid);background:#fafcff;}
.doc-tpl .fi{width:32px;height:32px;border-radius:7px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.doc-tpl h5{font-size:13.5px;margin-bottom:2px;}
.doc-tpl p{font-size:12px;color:var(--text-3);}

/* ---------- AI 写作工作台 ---------- */
.workspace{display:flex;height:100%;min-height:0;}
.editor-wrap{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff;}
.editor-toolbar{height:46px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 18px;flex-shrink:0;}
.tb-btn{height:30px;padding:0 9px;border-radius:6px;color:var(--text-2);display:inline-flex;align-items:center;gap:5px;font-size:13px;}
.tb-btn:hover{background:#f0f3f8;color:var(--text);}
.tb-btn svg{width:15px;height:15px;}
.tb-sep{width:1px;height:18px;background:var(--border);margin:0 4px;}
.tb-select{height:30px;border:1px solid var(--border);border-radius:6px;background:#fff;padding:0 6px;font-size:12.5px;color:var(--text-2);cursor:pointer;}
.tb-select:hover{border-color:var(--primary-mid);}
#editor h1{font-size:24px;margin:14px 0 10px;} #editor h2{font-size:19px;margin:12px 0 8px;} #editor h3{font-size:16px;margin:10px 0 6px;} #editor blockquote{border-left:3px solid var(--primary-mid);padding:4px 14px;color:var(--text-2);background:#f8fafe;margin:8px 0;}
#editor ul,#editor ol{padding-left:26px;margin:8px 0;} #editor ul li{list-style:disc;} #editor ol li{list-style:decimal;}
.editor-scroll{flex:1;overflow-y:auto;padding:30px 36px;}
#editor{min-height:100%;outline:none;font-size:15px;line-height:1.95;color:var(--text);}
#editor:empty::before{content:attr(data-placeholder);color:var(--text-3);}
#editor p{margin-bottom:10px;}
.editor-foot{height:38px;border-top:1px solid var(--border);display:flex;align-items:center;padding:0 18px;font-size:12px;color:var(--text-3);flex-shrink:0;gap:14px;}
.mark-problem{background:#e6edfc;border-bottom:1.5px wavy var(--primary);border-radius:2px;cursor:pointer;}
.mark-problem.active{background:#cddcfb;}
.floating-tools{position:absolute;z-index:50;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);display:flex;overflow:hidden;}
.floating-tools button{padding:7px 13px;font-size:13px;display:flex;align-items:center;gap:5px;color:var(--text-2);}
.floating-tools button:hover{background:var(--primary-light);color:var(--primary);}
.floating-tools svg{width:14px;height:14px;}

.right-panel{width:348px;flex-shrink:0;border-left:1px solid var(--border);background:#fbfcfe;display:flex;flex-direction:column;min-height:0;}
.rp-tabs{display:flex;flex-wrap:wrap;gap:2px;padding:10px 10px 0;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;position:relative;}
.rp-tab{padding:7px 10px;font-size:12.5px;border-radius:6px;color:var(--text-2);display:flex;align-items:center;gap:4px;}
.rp-tab svg{width:13px;height:13px;}
.rp-tab:hover{background:#f0f3f8;}
.rp-tab.active{background:var(--primary-light);color:var(--primary);font-weight:600;}
.rp-hide{position:absolute;top:10px;right:8px;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-3);}
.rp-hide:hover{background:#f0f3f8;}
.rp-body{flex:1;overflow-y:auto;padding:16px;}
.rp-collapsed{width:42px;}
.rp-collapsed .rp-body,.rp-collapsed .rp-tab span{display:none;}
.rp-collapsed .rp-tabs{flex-direction:column;padding:8px 6px;}
.rp-collapsed .rp-tab{padding:7px;justify-content:center;}

/* 历史记录 */
.hist-date{font-size:12px;color:var(--text-3);margin:12px 0 7px;font-weight:500;}
.hist-item{padding:10px 12px;background:#fff;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:.15s;}
.hist-item:hover{border-color:var(--primary-mid);}
.hist-item h5{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.hist-item p{font-size:11.5px;color:var(--text-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5;}

/* 步骤条 */
.stepper{display:flex;align-items:center;justify-content:center;margin:6px 0 22px;gap:0;}
.step-node{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1;}
.step-dot{width:26px;height:26px;border-radius:50%;background:#e7ebf3;color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;}
.step-node.done .step-dot{background:var(--primary);color:#fff;}
.step-node.current .step-dot{background:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primary-light);}
.step-node span{font-size:12px;color:var(--text-3);white-space:nowrap;}
.step-node.current span,.step-node.done span{color:var(--text);font-weight:500;}
.step-line{width:72px;height:2px;background:#e7ebf3;margin:0 12px;margin-bottom:20px;border-radius:2px;}
.step-line.done{background:var(--primary);}

.gen-mask{position:absolute;inset:0;background:rgba(255,255,255,.72);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--primary);font-size:14px;}
.gen-output{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;font-size:13.5px;line-height:1.85;white-space:pre-wrap;max-height:340px;overflow-y:auto;}
.ai-msg{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
.ai-msg .q{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;gap:7px;}
.ai-msg .a{font-size:13.5px;line-height:1.85;color:var(--text-2);white-space:pre-wrap;}
.ai-msg .ops{display:flex;gap:6px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--border);}
.quick-list{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
.quick-item{text-align:left;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12.5px;color:var(--text-2);}
.quick-item:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);}
.chat-input-box{border:1px solid var(--border-strong);border-radius:10px;background:#fff;transition:.15s;}
.chat-input-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,87,214,.1);}
.chat-input-box textarea{border:none;width:100%;padding:10px 12px;resize:none;background:transparent;line-height:1.6;}
.chat-input-box textarea:focus{box-shadow:none;}
.chat-input-foot{display:flex;align-items:center;padding:0 10px 8px;}
.send-btn{margin-left:auto;width:30px;height:30px;border-radius:7px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;}
.send-btn:disabled{background:#dde2ec;cursor:not-allowed;}
.send-btn svg{width:15px;height:15px;}

/* 校对 */
.proof-head{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px;}
.proof-num{font-size:20px;font-weight:700;color:var(--primary);}
.proof-item{background:#fff;border:1px solid var(--border);border-radius:8px;padding:11px 12px;margin-bottom:9px;cursor:pointer;}
.proof-item.active{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light);}
.proof-row{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;margin-bottom:6px;}

.pv-presets{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 10px;}

.logo-opt{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700;cursor:pointer;border:2px solid transparent;position:relative;}
.logo-opt.selected{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}

.toggle .track::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2);}

   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const h = (tag, attrs={}, children=[]) => {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==='class') el.className=v;
    else if (k==='html') el.innerHTML=v;
    else if (k==='text') el.textContent=v;
    else if (k.startsWith('on') && typeof v==='function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k==='dataset') Object.assign(el.dataset, v);
    else if (k==='style' && typeof v==='object') Object.assign(el.style, v);
    else el.setAttribute(k, v===true?'':v);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if (c==null||c===false) return;
    el.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return el;
};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid = () => 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now = () => Date.now();
function fmtTime(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function fmtDate(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function relDate(ts){
  const d=new Date(ts), today=new Date(); today.setHours(0,0,0,0);
  const diff=(today - new Date(d).setHours(0,0,0,0))/86400000;
  if (diff===0) return '今天'; if (diff===1) return '昨天'; if (diff<7) return `${Math.floor(diff)}天前`;
  return fmtDate(ts);
}
const delay = ms => new Promise(r=>setTimeout(r,ms));
function fileSize(bytes){ if(bytes<1024) return bytes+'B'; if(bytes<1048576) return (bytes/1024).toFixed(1)+'KB'; return (bytes/1048576).toFixed(1)+'MB'; }
const clone = o => JSON.parse(JSON.stringify(o));

/* 流式输出：把全文逐片写入 target（回调），支持停止；返回 controller */
function streamText(fullText, onChunk, opts={}){
  const speed = opts.speed||14; // 每片毫秒
  // 动态步进：总片数封顶约 100 片，长文也能在数秒内完成、短文保持逐字感
  const step = opts.step||Math.max(2,Math.ceil(fullText.length/100));
  let i=0, stopped=false, timer=null;
  return {
    start(){ return new Promise(resolve=>{
      const tick=()=>{ if(stopped){resolve(i);return;}
        i=Math.min(fullText.length, i+step);
        onChunk(fullText.slice(0,i), i>=fullText.length);
        if (i>=fullText.length){resolve(i);return;}
        timer=setTimeout(tick, speed);
      }; tick();
    });},
    stop(){ stopped=true; if(timer)clearTimeout(timer); }
  };
}

// 节流自动滚动：避免流式输出时每片读取 scrollHeight 造成强制同步布局（长文卡顿）
function makeAutoScroll(el){let last=0;return function(force){const n=(typeof performance!=='undefined'?performance.now():Date.now());if(force||n-last>120){if(el)el.scrollTop=el.scrollHeight;last=n;}};}

let toastTimer={};
function toast(msg, type='success', dur=2400){
  const wrap=$('#toastWrap');
  const icon = type==='success'?ICON.check:type==='warn'?ICON.warn:type==='error'?ICON.error:ICON.info;
  const t=h('div',{class:'toast '+type},[h('span',{html:icon}), h('span',{text:msg})]);
  wrap.appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .3s,transform .3s';t.style.opacity='0';t.style.transform='translateY(-8px)';setTimeout(()=>t.remove(),300);},dur);
}

/* 通用模态：content 为 DOM；返回根节点，close() 关闭 */
let activeModal=null;
function openModal({width=560, title, body, footer, onClose, customClass=''}){
  closeModal();
  const root=$('#modalRoot');
  const closeBtn=h('button',{class:'modal-close',html:ICON.close,onClick:()=>closeModal()});
  const modal=h('div',{class:'modal '+customClass,style:{width:width+'px',maxWidth:'94vw'}},[
    title?h('div',{class:'modal-head'},[h('h3',{text:title}),closeBtn]):null,
    h('div',{class:'modal-body'},Array.isArray(body)?body:[body]),
    footer?h('div',{class:'modal-foot'},footer):null
  ]);
  const mask=h('div',{class:'modal-mask',onClick:e=>{if(e.target===e.currentTarget)closeModal();}},[modal]);
  root.appendChild(mask);
  activeModal={mask,onClose};
  return {modal,mask,close:closeModal};
}
function closeModal(){ if(activeModal){const{mask,onClose}=activeModal;mask.remove();activeModal=null;onClose&&onClose();} }
function confirmDialog({title='提示', content='确定执行该操作吗？', okText='确定', cancelText='取消', danger=true}){
  return new Promise(resolve=>{
    const ok=h('button',{class:'btn '+(danger?'btn-danger':'btn-primary'),text:okText,onClick:()=>{closeModal();resolve(true);}});
    const cancel=h('button',{class:'btn',text:cancelText,onClick:()=>{closeModal();resolve(false);}});
    openModal({width:380,body:[h('div',{class:'confirm-body'},[
      h('div',{class:'confirm-icon',html:ICON.error}),
      h('div',{class:'confirm-text'},[h('h4',{text:title}),h('p',{text:content})])
    ])],footer:[cancel,ok]});
  });
}
/* 剪贴板：优先 Clipboard API，失败回退 execCommand（兼容 file:// 双击打开） */
function clipboardCopy(text){
  return new Promise((resolve,reject)=>{
    if(navigator.clipboard&&window.isSecureContext!==false&&location.protocol!=='file:'){
      navigator.clipboard.writeText(text).then(resolve).catch(()=>fallback());
    }else fallback();
    function fallback(){
      try{
        const ta=document.createElement('textarea');
        ta.value=text;ta.style.position='fixed';ta.style.top='-9999px';ta.style.opacity='0';
        document.body.appendChild(ta);ta.focus();ta.select();
        const ok=document.execCommand('copy');ta.remove();
        ok?resolve():reject(new Error('copy failed'));
      }catch(e){reject(e);}
    }
  });
}
/* 文件下载（Blob，兼容本地打开） */
function downloadBlob(filename, content, mime='text/plain;charset=utf-8'){
  const blob=content instanceof Blob?content:new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},1500);
}

}

/* ============================================================
   纯前端 PDF 文本提取（无第三方库）
   支持 FlateDecode(zlib) 解压、ToUnicode CMap(bfchar/bfrange) 还原中文、
   Tj/TJ 文本操作符与排版换行；扫描件无文本层时返回空串由上层判定。
   ============================================================ */
const PdfExtract=(function(){
  async function inflate(bytes){
    try{
      const ds=new DecompressionStream('deflate');
      const stream=new Blob([bytes]).stream().pipeThrough(ds);
      const ab=await new Response(stream).arrayBuffer();
      return new Uint8Array(ab);
    }catch(e){return null;}
  }
  // 字节→二进制字符串（真正逐字节直映；勿用 TextDecoder latin1，其按 windows-1252 映射会破坏 0x80-0x9F）
  function bytesToStr(bytes){let s='';const CH=0x8000;for(let i=0;i<bytes.length;i+=CH)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));return s;}
  // 提取全部 stream（优先 /Length，回退正则）
  function* rawStreams(bytes){
    const s=bytesToStr(bytes);
    const re=/(?<!end)stream(\r\n|\n|\r)/g;let m;
    while((m=re.exec(s))){
      const start=m.index+m[0].length;
      // 用最近的 /Length
      const head=s.slice(Math.max(0,m.index-400),m.index);
      const allLen=head.match(/\/Length\s+(\d+)/g);
      const lm=allLen&&allLen.length?/(\d+)/.exec(allLen[allLen.length-1]):null;
      let end;
      if(lm){const len=+lm[1];end=start+len;}
      else{const ei=s.indexOf('endstream',start);end=ei;}
      const chunk=s.slice(start,end).replace(/(\r\n|\n|\r)$/,'');
      yield {text:chunk,head:head};
    }
  }
  function latinBytes(str){const u=new Uint8Array(str.length);for(let i=0;i<str.length;i++)u[i]=str.charCodeAt(i)&0xff;return u;}
  // hex(UTF16-BE) -> 字符串
  function hexToUnicode(hex){
    hex=hex.replace(/\s/g,'');let out='';
    for(let i=0;i+4<=hex.length;i+=4){const code=parseInt(hex.slice(i,i+4),16);if(!isNaN(code))out+=String.fromCharCode(code);}
    return out;
  }
  // 解析全部 ToUnicode CMap，合并为 cid(整数)->字符
  function parseCMap(text,map){
    const blocks=text.match(/beginbfchar[\s\S]*?endbfchar/g)||[];
    blocks.forEach(b=>{
      const re=/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f\s]+)>/g;let m;
      while((m=re.exec(b)))map.set(parseInt(m[1],16),hexToUnicode(m[2]));
    });
    const ranges=text.match(/beginbfrange[\s\S]*?endbfrange/g)||[];
    ranges.forEach(b=>{
      const lines=b.split('\n');
      lines.forEach(line=>{
        let m=/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*(?:<([0-9A-Fa-f\s]+)>|\[([^\]]*)\])/.exec(line);
        if(!m)return;
        const lo=parseInt(m[1],16),hi=parseInt(m[2],16);
        if(m[3]!==undefined){
          let cur=parseInt(m[3].replace(/\s/g,'').slice(0,4),16);
          for(let c=lo;c<=hi;c++)map.set(c,String.fromCharCode(cur++));
        }else if(m[4]!==undefined){
          const items=m[4].match(/<([0-9A-Fa-f\s]+)>/g)||[];let idx=0;
          for(let c=lo;c<=hi&&idx<items.length;c++,idx++)map.set(c,hexToUnicode(items[idx].replace(/[<>]/g,'')));
        }
      });
    });
  }
  // 解析 PDF 字面字符串转义 -> 字节数组
  function parseLiteral(str){
    const out=[];for(let i=0;i<str.length;i++){
      let c=str[i];
      if(c==='\\'){
        const n=str[i+1];
        if(n>='0'&&n<='7'){let oct='';let j=i+1;while(j<str.length&&str[j]>='0'&&str[j]<='7'&&oct.length<3){oct+=str[j];j++;}out.push(parseInt(oct,8)&0xff);i=j-1;continue;}
        const esc={n:'\n',r:'\r',t:'\t',b:'\b',f:'\f','(':'(',')':')','\\':'\\'};
        out.push((esc[n]||n).charCodeAt(0)&0xff);i++;continue;
      }
      out.push(str.charCodeAt(i)&0xff);
    }
    return out;
  }
  // 字节序列按 CMap 解码（尝试 2 字节 CID，再 1 字节）
  function decodeBytes(bytes,map){
    let out='';
    if(bytes.length>=2){
      let two='';let ok=true;const tmp=[];
      for(let i=0;i+1<bytes.length;i+=2){const cid=(bytes[i]<<8)|bytes[i+1];if(map.has(cid))tmp.push(map.get(cid));else{ok=false;break;}}
      if(ok&&tmp.length){return tmp.join('');}
    }
    for(let i=0;i<bytes.length;i++){
      if(map.has(bytes[i]))out+=map.get(bytes[i]);
      else out+=String.fromCharCode(bytes[i]);
    }
    return out;
  }
  function decodeHex(hex,map){
    hex=hex.replace(/\s/g,'');let out='';
    if(hex.length%4===0){
      let ok=true;const tmp=[];
      for(let i=0;i+4<=hex.length;i+=4){const cid=parseInt(hex.slice(i,i+4),16);if(map.has(cid))tmp.push(map.get(cid));else{ok=false;break;}}
      if(ok&&tmp.length)return tmp.join('');
    }
    for(let i=0;i+2<=hex.length;i+=2){const cid=parseInt(hex.slice(i,i+2),16);out+=map.has(cid)?map.get(cid):String.fromCharCode(cid);}
    return out;
  }
  // 从内容流抽取文本
  function extractFromContent(text,map){
    let out='';
    const blocks=text.match(/BT[\s\S]*?ET/g)||[];
    blocks.forEach(blk=>{
      let line='';
      let lastY=null;
      // 词法扫描
      let i=0;
      const pushSpace=()=>{if(line&&!/\s$/.test(line))line+=' ';};
      while(i<blk.length){
        const c=blk[i];
        // Tm 定位：a b c d e f Tm，f 为 y
        let mt=/(-?\d+\.?\d*)\s+(-?\d+\.?\d*)\s+(-?\d+\.?\d*)\s+(-?\d+\.?\d*)\s+(-?\d+\.?\d*)\s+(-?\d+\.?\d*)\s+Tm/.exec(blk.slice(i,i+160));
        if(mt&&mt.index===0){const y=parseFloat(mt[6]);if(lastY!==null&&Math.abs(y-lastY)>2){out+=(out&&!/\n$/.test(out)?'\n':'')+line;line='';}lastY=y;i+=mt[0].length;continue;}
        if(/^T\*\s*/.test(blk.slice(i,3))){out+=(line?'\n':'');line='';i+=2;continue;}
        let md=/^(-?\d+\.?\d*)\s+(-?\d+\.?\d*)\s+T[dD]/.exec(blk.slice(i,80));
        if(md&&md.index===0){const y=parseFloat(md[2]);if(Math.abs(y)>2){out+=(line?'\n':'');line='';}i+=md[0].length;continue;}
        // TJ 数组
        if(c==='['){
          const close=blk.indexOf(']',i);
          if(close>0){
            const arr=blk.slice(i+1,close);const tjM=/\]\s*TJ/.exec(blk.slice(close,close+6));
            const parts=arr.match(/<[^>]*>|\([^)]*\)|-?\d+\.?\d*/g)||[];
            parts.forEach(p=>{
              if(p[0]==='<')line+=decodeHex(p.slice(1,-1),map);
              else if(p[0]==='(')line+=decodeBytes(parseLiteral(p.slice(1,-1)),map);
              else{const n=parseFloat(p);if(n<=-80)pushSpace();}
            });
            i=close+1+(tjM?tjM[0].length:0);continue;
          }
        }
        // Tj 单串
        if(c==='('){
          let j=i+1,depth=1;
          while(j<blk.length&&depth){if(blk[j]==='\\'){j+=2;continue;}if(blk[j]==='(')depth++;else if(blk[j]===')')depth--;j++;}
          const lit=blk.slice(i+1,j-1);
          const tail=blk.slice(j,j+4);
          line+=decodeBytes(parseLiteral(lit),map);
          i=j;continue;
        }
        if(c==='<'){
          const j=blk.indexOf('>',i);
          if(j>0){line+=decodeHex(blk.slice(i+1,j),map);i=j+1;continue;}
        }
        i++;
      }
      if(line)out+=line+'\n';
    });
    return out;
  }
  async function extract(arrayBuffer){
    const bytes=new Uint8Array(arrayBuffer);
    // 第一遍：解压所有流
    const decoded=[];const cmap=new Map();
    for(const {text} of rawStreams(bytes)){
      const raw=latinBytes(text);
      let dec=await inflate(raw); // FlateDecode(zlib)；非压缩数据会返回 null
      if(dec){
        const t=new TextDecoder('utf-8',{fatal:false}).decode(dec);
        decoded.push(t);
        if(/begincmap|beginbfchar|beginbfrange/.test(t))parseCMap(t,cmap);
      }else{
        // 未压缩流：CMap 或明文内容流同样纳入
        if(/begincmap|beginbfchar|beginbfrange/.test(text)){decoded.push(text);parseCMap(text,cmap);}
        else if(/\bBT\b/.test(text))decoded.push(text);
      }
    }
    // 未压缩对象流里也可能直接含 CMap
    const latinAll=bytesToStr(bytes);
    if(/begincmap/.test(latinAll))parseCMap(latinAll,cmap);
    // 第二遍：从解压后的内容流抽文本
    let full='';
    decoded.forEach(t=>{if(/\bBT\b/.test(t))full+='\n'+extractFromContent(t,cmap);});
    // 清理：合并过度断行、去零宽、统一空白
    full=full.replace(/\x00/g,'').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').replace(/[ \t]{2,}/g,' ').trim();
    return {text:full,cmapSize:cmap.size};
  }
  return {extract};
})();

function splitSentences(text){
  return (text||'').replace(/\r/g,'').split(/(?<=[。！？；!?;\n])/).map(s=>s.trim()).filter(Boolean);
}
const STOP_WORDS=new Set(['我们','你们','他们','它们','这个','那个','这些','那些','一个','一些','一种','以及','对于','关于','根据','按照','通过','进行','相关','工作','情况','问题','需要','应当','应该','可以','以及','及','和','与','或','的','了','在','是','和','与','及','或','把','被','将','对','为','以','于','中','内','上','下','你','我','他','她','它','们','这','那','就','都','很','也','还','又','再','便','则','而','且','并','但','却','由','从','向','到','给','让','使','令','个','些','项','件','次','不','没','无','有','要','会','能','可','之','其','此','该','本','各','每','某','所','等','般','样','种','类','时','时候','方面','方式','进行','开展','实现','提高','加强','推进','落实','认真','积极','进一步','目前','现在','已经','正在','将','会','啊','吧','呢','吗','嘛','哦','哈','呀','啦','么','着','过','地','得']);
// 中文 2-4 字词频统计（基于 N-gram 粗切，配合停用词与词长过滤）
function keywordFreq(text,topN=12){
  const clean=(text||'').replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,' ');
  const freq={};
  // 2~4 字滑窗
  for(const seg of clean.split(/\s+/)){
    for(let len=2;len<=4;len++){
      for(let i=0;i+len<=seg.length;i++){
        const w=seg.slice(i,i+len);
        if(/^[0-9]+$/.test(w))continue;
        if(STOP_WORDS.has(w))continue;
        // 首尾是停用单字的降权/跳过
        const head=w[0],tail=w[w.length-1];
        if('的了在是和与及或将把被对为以于中我你他她它们这那就都很也还而且并但由从向到给让使不没无有要会能可之其此该本各每等种时'.includes(head))continue;
        if('的了在是和与及或将把被对为以于中我你他她它们这那就都很也还而且并但由从向到给让使不没无有要会能可之其此该本各每等种时地得着过'.includes(tail))continue;
        freq[w]=(freq[w]||0)+1;
      }
    }
  }
  // 长词包含短词且频次相同则抑制短词
  const entries=Object.entries(freq).filter(([w,c])=>c>=1);
  const score={};
  entries.forEach(([w,c])=>{score[w]=c*(w.length>=3?1.6:1);});
  return entries.map(([w])=>[w,score[w]]).sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length).slice(0,topN).map(x=>x[0]);
}
// 抽取式摘要：句子打分（位置、关键词、线索词、长度）
function extractSummary(text,maxSent=5){
  const sents=splitSentences(text);
  if(sents.length<=maxSent)return sents;
  const kws=new Set(keywordFreq(text,20));
  const clue=/一是|二是|三是|首先|其次|再次|最后|总体|综上|因此|总之|主要|关键|核心|重点|目标|任务|要求|原则|措施|成效|结果|表明|显示|认为|指出|强调/;
  const scored=sents.map((s,i)=>{
    let sc=0;
    for(const w of kws){if(s.includes(w))sc+=1.2;}
    if(clue.test(s))sc+=2;
    sc+=Math.max(0,2-i*0.4); // 开头句权重
    const len=s.length; if(len<10)sc-=2; if(len>120)sc-=1;
    return {s,sc,i};
  }).sort((a,b)=>b.sc-a.sc);
  return scored.slice(0,maxSent).sort((a,b)=>a.i-b.i).map(x=>x.s);
}
// 识别/生成大纲
function buildOutline(text){
  const heads=[];
  const lines=(text||'').split(/\n/).map(x=>x.trim()).filter(Boolean);
  const reNum=/^(?:[一二三四五六七八九十]+、|（[一二三四五六七八九十]+）|\([一二三四五六七八九十]+\)|\d+[.、]|[（(]\d+[)）]|第[一二三四五六七八九十\d]+[章节部分])/;
  lines.forEach(l=>{if(reNum.test(l)&&l.length<=40)heads.push(l.replace(/[。：:\s]+$/,''));});
  if(heads.length>=2)return [...new Set(heads)].slice(0,12);
  // 无编号：用要点句生成
  return extractSummary(text,6).map((s,i)=>`${'一二三四五六七八九十'[i]}、${s.length>26?s.slice(0,26)+'…':s}`);
}

AI.proof=function(text, enabled){

  if(has('common')) Object.assign(dict,{'帐户':'账户','帐目':'账目','报导':'报道','身分':'身份','份量':'分量','服法':'伏法'});
  if(has('colloc')) Object.assign(dict,{'增加效率':'提高效率','达成目标':'实现目标','做出贡献':'作出贡献','达成成绩':'取得成绩','提高意识':'增强意识','召开活动':'举办活动','达成效果':'取得效果','受到好评如潮':'广受好评'});
  for(const [wrong,right] of Object.entries(dict)){ let idx=0; while((idx=text.indexOf(wrong,idx))>=0){ issues.push({old:wrong,fix:right,cat:'错别字',label:'用词规范'}); idx+=wrong.length; } }
  if(has('ddd')){
    const re1=/((?:认真|扎实|积极|深入|持续|稳步|不断|切实|努力|主动|逐步|全面|严格|进一步|扎实有效|坚定不移|坚持不懈|持续深入|更好|更快|高质量)(的))(?=[一-龥]{0,3}(?:推进|开展|落实|做好|加强|提升|组织|实施|学习|工作|发展|建设|执行|整改|排查|调研|服务|运行|治理|攻坚|提高|促进|推动|深化|优化|完善|筑牢|守好))/g; let m;
    while((m=re1.exec(text))) issues.push({old:m[0],fix:m[0].replace('的','地'),cat:'的地得',label:'状语后应用“地”'});
    const re2=/(跑|做|干|发展|推进|落实|开展|进行|完成|抓|成长|转变|办|写|说|干|跑)(的)(?=很|非常|十分|更加|比较|格外|出奇)/g;
    while((m=re2.exec(text))) issues.push({old:m[0],fix:m[0].slice(0,-1)+'得',cat:'的地得',label:'补语前应用“得”'});
    // 名词前“地/得”误用为“的”的反面：动词前用“的”
    const re3=/(地)(?=(?:进行|开展|推进|落实|执行|组织|实施|研究|部署|安排))/g;
  }
  if(has('punct')){
    const map={',':'，','?':'？','!':'！',';':'；',':':'：'};
    for(let i=0;i<text.length;i++){ const ch=text[i]; if(map[ch]){ const prev=text[i-1]||'',next=text[i+1]||'';
      if(/[一-龥]/.test(prev)||/[一-龥]/.test(next)){ issues.push({old:ch,fix:map[ch],cat:'标点符号',label:'中文语境应用全角标点'}); } } }
    // 英文句号（中文之间）
    for(let i=0;i<text.length;i++){if(text[i]==='.'){const prev=text[i-1]||'',next=text[i+1]||'';if(/[一-龥]/.test(prev)&&!/\d/.test(prev))issues.push({old:'.',fix:'。',cat:'标点符号',label:'中文句末应用全角句号'});}}
  }
  if(has('repeat')){
    const dup=/([一-龥]{2,})\1/g; let m2; while((m2=dup.exec(text))) issues.push({old:m2[0],fix:m2[1],cat:'句子重复',label:'疑似重复词语'});

  }
  // 去重（同 old+fix）
  const seen=new Set();return issues.filter(x=>{const k=x.old+'|'+x.fix;if(seen.has(k))return false;seen.add(k);return true;});
};

/* AI 文档：综合文本分析 */
AI.analyze=function(text){
  text=text||'';
  const plain=text.replace(/\s/g,'');
  const sents=splitSentences(text);
  const kws=keywordFreq(text,15);
  const summary=extractSummary(text,5).join('');
  const outline=buildOutline(text);
  const points=extractSummary(text,8).map((s,i)=>`${i+1}. ${s}`);
  // 可读性统计
  const avgLen=sents.length?Math.round(plain.length/sents.length):0;
  return {
    chars:plain.length, sents:sents.length, paras:text.split(/\n+/).filter(x=>x.trim()).length, avgLen,
    keywords:kws, summary, points, outline,
    read:avgLen>45?'句子偏长，建议适当断句以提升可读性':avgLen<12&&sents.length>3?'句子偏短、略显零散，可适当合并':'语句长度适中，整体可读性良好'
  };
};
/* 文档问答：基于文档原文检索后组织回答 */
AI.docAsk=function(query, rawText, agent){
  const sents=splitSentences(rawText||'');
  if(!sents.length)return '该文档暂未解析出可用文本（可能是扫描件或无文本层），请更换电子版 PDF，或在文档管理中重新上传。';
  const qk=keywordFreq(query,6).concat(query.replace(/[的了吗呢？?\s]/g,'').split('').filter(x=>x.length));
  const scored=sents.map((s,idx)=>{let sc=0;for(const w of qk){if(s.includes(w))sc+=w.length>=2?2:0.4;}return {s,idx,sc};}).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc||a.idx-b.idx);
  const ev=scored.slice(0,4).sort((a,b)=>a.idx-b.idx).map(x=>x.s);
  if(!ev.length){
    // 无直接命中：给文档概要
    return `文档中未检索到与“${query}”直接对应的表述。根据文档整体内容，可为您提供以下概要：\n${extractSummary(rawText,4).join('')}\n您可以换个关键词再问，例如直接引用文档中的专有名词。`;
  }
  const ans=ev.join('');
  return `根据文档内容，${/[？?]\s*$/.test(query)?'':''}回答如下：\n${ans}\n\n【依据原文】\n${ev.map((s,i)=>`[${i+1}] ${s.length>120?s.slice(0,120)+'…':s}`).join('\n')}`;
};

AI.optimize=function(p){
  const role=(p.match(/你是一?[位名个]?([^，。,.；;]{2,16})/)||[,'资深领域专家'])[1];
  return `# Role：${role}\n\n## Background：\n用户在实际业务中存在专业内容生产与决策辅助需求，需要一位经验丰富的专家角色提供高质量、可落地的支持。\n\n## Attention：\n请以严谨、负责、积极的态度对待每一次任务，追求专业准确与实用价值。\n\n## Profile：\n- Author: 影源智能体编排\n- Version: 1.0\n- Language: 中文\n- Description: 基于以下人物设定塑造的专业角色：${p}\n\n### Skills：\n- 扎实的领域知识与规范表达能力\n- 结构化分析与逻辑推理能力\n- 结合业务场景给出可执行建议的能力\n\n## Goals：\n- 准确理解用户意图，输出结构清晰、重点突出的结果\n- 保证内容专业、严谨、符合规范\n- 在信息不足时主动澄清关键前提\n\n## Constrains：\n- 不虚构事实与数据，不确定时明确说明\n- 严格遵循用户指定的格式、篇幅与语气\n- 输出层次分明，便于直接使用\n\n## Workflow：\n1. 先分析用户需求，提取关键信息与约束条件\n2. 结合角色定位制定回答框架\n3. 补充必要的背景信息与专业建议\n4. 按 OutputFormat 输出最终结果\n5. 自检逻辑、事实与格式后交付\n\n## OutputFormat：\n- 结论先行，分点展开\n- 关键内容使用小标题组织\n- 需要时给出示例与行动清单\n\n## Suggestions：\n- 可补充具体受众、使用场景与篇幅要求\n- 可提供参考范文，便于统一风格\n- 可指定输出模板，提升结果稳定性\n\n## Initialization\nAs a/an ${role}, you must follow the Constrains, talk to user in 中文, greet the user briefly, then introduce yourself and the Workflow.`;
};
/* 自动生成开场白与预置问题 */
AI.genOpening=function(p){
  const role=(p.match(/你是一?[位名个]?([^，。,.；;]{2,14})/)||[, '智能助手'])[1];
  return {
    opening:`您好，我是${role}。我将基于专业经验为您提供高质量的内容支持，请直接描述您的需求，也可以点击下方预置问题快速开始。`,
    presets:['请介绍一下你的能力范围','帮我梳理一份写作提纲','针对我的需求给出专业建议']
  };
};

function parseRoute(){
  const raw=location.hash.slice(1)||'/center';
  const [path,qs]=raw.split('?');
  const params={}; (qs||'').split('&').filter(Boolean).forEach(kv=>{const[k,v]=kv.split('=');params[k]=decodeURIComponent(v||'');});
  return {path,params};
}

function router(){
  const {path,params}=parseRoute();
  const view=$('#view'); view.scrollTop=0;
  window._routeParams=params;

    '/center':'Center','/writing':'Writing','/agent':'AgentChat','/agent-edit':'AgentEdit',

        h('p',{text:a.intro||''}),
        h('div',{class:'agent-from'},[h('span',{text:isMine?('最近编辑 '+fmtTime(a.ut)):'来自 · '+a.cat})])
      ]),
      ops

  async function delMyAgent(a){
    const ok=await confirmDialog({title:'删除智体',content:`确定删除智体“${a.name}”吗？删除后不可恢复。`,okText:'删除'});
    if(!ok)return;
    S.myAgents=S.myAgents.filter(x=>x.id!==a.id); S.used=S.used.filter(x=>x!==a.id); saveState(); renderTab(); toast('已删除');

    tabBar.innerHTML='';
    CATS.forEach(c=>{ tabBar.appendChild(h('button',{class:'tab'+(curTab===c?' active':''),text:c,onClick:()=>{curTab=c;renderTab();}})); });
    grid.innerHTML='';
    let list=[];

      const mine=[...S.myAgents].sort((a,b)=>b.ut-a.ut);
      const others=MARKET.filter(m=>!S.myAgents.some(x=>x.name===m.name));
      list=[...mine.map(a=>({a,mine:true})),...others.map(a=>({a,mine:false}))];
    }else if(curTab==='我的智体'){
      list=[...S.myAgents].sort((a,b)=>b.ut-a.ut).map(a=>({a,mine:true}));
    }else{

      const minePub=S.myAgents.filter(a=>a.status==='published'&&a.visibility==='public'&&a.category===curTab).map(a=>({a,mine:true}));
      const built=MARKET.filter(m=>m.cat===curTab&&!S.myAgents.some(x=>x.name===m.name)).map(a=>({a,mine:false}));
      list=[...minePub,...built];

    h('div',{class:'section-head'},[h('h2',{text:'公文范文'}),h('button',{class:'btn btn-sm',html:ICON.arrowR+' 进入范文库',onClick:()=>go('#/templates')})]),

      h('span',{class:'fi',html:ICON.doc}),
      h('div',{},[h('h5',{text:t.name}),h('p',{text:t.intro})])
    ])))
  ]);
  view.appendChild(h('div',{class:'page'},[recoSec,discoverSec,tplSec]));
  renderTab();
};

function genLogoDataURL(ch, colors){
  const cv=document.createElement('canvas');cv.width=cv.height=120;
  const ctx=cv.getContext('2d');
  const g=ctx.createLinearGradient(0,0,120,120);g.addColorStop(0,colors[0]);g.addColorStop(1,colors[1]);
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(0,0,120,120,26);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='700 58px "Noto Sans SC",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,60,66);
  return cv.toDataURL('image/png');
}
function openCreateAgent(existing){
  const isEdit=!!existing;
  let logos=[]; let selected=0;
  const nameInput=h('input',{class:'input',maxlength:50,placeholder:'给智体起一个独一无二的名字',value:existing?existing.name:''});
  const nameCount=h('span',{class:'char-count',text:(existing?existing.name.length:0)+'/50'});
  nameInput.addEventListener('input',()=>nameCount.textContent=nameInput.value.length+'/50');
  const introInput=h('textarea',{class:'textarea',rows:4,maxlength:2000,placeholder:'介绍智体的功能，将会展示给智体的用户',text:existing?existing.intro:''});
  const introCount=h('span',{class:'char-count',text:(existing?existing.intro.length:0)+'/2000'});
  introInput.addEventListener('input',()=>introCount.textContent=introInput.value.length+'/2000');
  const logoList=h('div',{class:'logo-gen-list'});
  if(existing&&existing.logoData){ logos=[{data:existing.logoData,color:existing.logoColor}]; }
  else { const c=LOGO_COLORS[Math.floor(Math.random()*LOGO_COLORS.length)]; logos=[{data:genLogoDataURL((existing?existing.name:'智').charAt(0)||'智',c),color:c}]; }
  function renderLogos(){
    logoList.innerHTML='';
    logos.forEach((lg,i)=>{
      const im=h('img',{src:lg.data,class:'logo-opt'+(i===selected?' selected':''),onClick:()=>{selected=i;renderLogos();},style:{width:'52px',height:'52px',borderRadius:'12px'}});
      logoList.appendChild(im);
    });
  }
  const genBtn=h('button',{class:'btn btn-sm',title:'输入名称和介绍后，点击自动生成头像',html:ICON.spark+' 生成',onClick:()=>{
    if(!nameInput.value.trim()){toast('请先输入智体名称','warn');return;}
    if(logos.length>=5){toast('最多生成 5 张图标','warn');return;}
    genBtn.disabled=true; genBtn.innerHTML='<span class="spinner"></span> 生成中';
    setTimeout(()=>{
      const c=LOGO_COLORS[Math.floor(Math.random()*LOGO_COLORS.length)];
      logos.push({data:genLogoDataURL(nameInput.value.trim().charAt(0),c),color:c});
      selected=logos.length-1; renderLogos();
      genBtn.disabled=false; genBtn.innerHTML=ICON.spark+' 生成';
    },700);
  }});
  renderLogos();
  const okBtn=h('button',{class:'btn btn-primary',text:isEdit?'保存修改':'确定创建',onClick:()=>{
    if(!nameInput.value.trim()){toast('请输入智体名称','warn');return;}
    if(!logos[selected]){toast('请生成或选择图标','warn');return;}
    const lg=logos[selected];
    if(isEdit){
      Object.assign(existing,{name:nameInput.value.trim(),intro:introInput.value.trim(),logoColor:lg.color,logoData:lg.data,ut:now()});
      saveState();closeModal();renderSidebar();toast('智体信息已更新');
      if(parseRoute().path==='/agent-edit') Views.AgentEdit({id:existing.id}); else router();
    }else{
      const a={id:uid(),name:nameInput.value.trim(),intro:introInput.value.trim(),persona:'',opening:'',presets:['','',''],logoColor:lg.color,logoData:lg.data,status:'draft',publishNote:'',visibility:'private',category:'党政媒体',ct:now(),ut:now()};
      S.myAgents.unshift(a); saveState(); closeModal(); renderSidebar(); toast('智体已创建');
      go('#/agent-edit?id='+a.id);
    }
  }});
  openModal({width:560,title:isEdit?'编辑智体':'创建智体',body:[
    h('div',{class:'field'},[h('div',{class:'field-label'},['智体名称 ',h('span',{class:'req',text:'*'})]),nameInput,nameCount]),
    h('div',{class:'field'},[h('div',{class:'field-label',text:'功能介绍'}),introInput,introCount]),
    h('div',{class:'field'},[h('div',{class:'field-label'},['图标 ',h('span',{class:'req',text:'*'}),' ',genBtn]),
      h('div',{class:'field-hint',text:'点击“生成”由 AI 分析名称与介绍生成图标，最多可生成 5 张，新生成的自动选中'}),logoList])
  ],footer:[h('button',{class:'btn',text:'取消',onClick:closeModal}),okBtn]});
}

/* ---------- AI 校对 ---------- */
function getProofCfg(){
  if(Writing.proofCfg)return Writing.proofCfg;
  const cfg=new Set();PROOF_RULES.groups.forEach(g=>g.items.forEach(i=>{if(i.def||i.fixed)cfg.add(i.k);}));
  Writing.proofCfg=cfg;return cfg;
}
function panelProof(root){
  const cfg=getProofCfg();
  const resultBox=h('div',{style:{flex:1}});
  const fixAllBtn=h('button',{class:'btn-text fs12',text:'全部修正',onClick:applyAll});
  const head=h('div',{class:'proof-head'},[
    h('span',{class:'proof-num',text:String(Writing.proofIssues.length)}),h('span',{class:'fs13',text:'个问题'}),
    fixAllBtn,
    h('button',{class:'btn-text fs12',style:{marginLeft:'auto'},text:'清除',onClick:()=>{Writing.proofIssues=[];clearMarks();renderResult();toast('已清除校对结果');}})
  ]);
  function applyAll(){
    if(!Writing.proofIssues.length){toast('请先开始校对','warn');return;}
    let text=editor.getText();const uniq=new Map();const remain=[];
    Writing.proofIssues.forEach(is=>{if(/^（/.test(is.fix)){remain.push(is);}else uniq.set(is.old,is.fix);});
    let n=0;
    [...uniq.entries()].sort((a,b)=>b[0].length-a[0].length).forEach(([o,f])=>{if(text.includes(o)){text=text.split(o).join(f);n++;}});
    editor.set(text);Writing.proofIssues=remain;renderMarks();renderResult();
    toast(n?`已一键修正 ${n} 类问题，剩余 ${remain.length} 项需人工判断`:'没有可自动修正的问题，剩余项请人工判断','info');
  }
  const actions=h('div',{},[
    h('button',{class:'btn',style:{width:'100%',marginBottom:'8px'},html:ICON.proof+' 勾选校对规则',onClick:openRuleDialog}),
    h('button',{class:'btn btn-primary',style:{width:'100%'},id:'proofBtn',html:ICON.spark+' 开始校对',onClick:doProof})
  ]);
  function renderResult(){
    head.querySelector('.proof-num').textContent=String(Writing.proofIssues.length);
    resultBox.innerHTML='';
    if(!Writing.proofIssues.length){resultBox.appendChild(h('div',{class:'field-hint',text:'校对结果将展示在这里，每条支持替换与忽略'}));return;}
    Writing.proofIssues.forEach((is,idx)=>{
      is.idx=idx;
      const item=h('div',{class:'proof-item','data-i':idx,onClick:()=>{$$('.proof-item',resultBox).forEach(x=>x.classList.remove('active'));item.classList.add('active');const m=$$('.mark-problem',editor.el)[idx];if(m){m.classList.add('active');const sc=editor.el.closest('.editor-wrap')||editor.el.parentElement;const r=m.getBoundingClientRect(),sr=sc.getBoundingClientRect();sc.scrollTop+=(r.top-sr.top)-sr.height/2;setTimeout(()=>m.classList.remove('active'),1200);}}},[
        h('div',{class:'proof-row'},[h('span',{class:'lab',text:'原文'}),h('span',{class:'proof-old',text:is.old}),h('span',{class:'proof-cat',text:is.label})]),
        h('div',{class:'proof-row'},[h('span',{class:'lab',text:'建议'}),h('span',{class:'proof-new',text:is.fix}),
          h('button',{class:'icon-btn',title:'替换为建议内容',style:{marginLeft:'auto'},html:ICON.arrowR,onClick:e=>{e.stopPropagation();applyFix(is);}})]),
        h('div',{class:'proof-item-foot'},[h('button',{class:'btn-text fs12 danger',text:'忽略',onClick:e=>{e.stopPropagation();ignoreIssue(is);}})])
      ]);
      resultBox.appendChild(item);
    });
  }
  function doProof(){
    const text=editor.getText();if(!text.trim()){toast('编辑区内容为空','warn');return;}
    const btn=$('#proofBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> 校对中';
    setTimeout(()=>{
      Writing.proofIssues=AI.proof(text,cfg);
      btn.disabled=false;btn.innerHTML=ICON.spark+' 重新校对';
      renderMarks();renderResult();
      toast(Writing.proofIssues.length?`校对完成，发现 ${Writing.proofIssues.length} 个问题`:'校对完成，未发现问题','info');
    },1200);
  }
  function applyFix(is){
    // 在编辑器纯文本中替换第一处匹配
    let text=editor.getText();const pos=text.indexOf(is.old);
    if(pos<0){toast('原文内容已变化，请重新校对','warn');return;}
    const ntext=text.slice(0,pos)+is.fix+text.slice(pos+is.old.length);
    editor.set(ntext);
    Writing.proofIssues=Writing.proofIssues.filter(x=>x!==is);renderMarks();renderResult();
  }
  function ignoreIssue(is){Writing.proofIssues=Writing.proofIssues.filter(x=>x!==is);renderMarks();renderResult();}
  root.append(actions,head,resultBox);
  if(Writing.proofIssues.length)renderResult();else resultBox.appendChild(h('div',{class:'field-hint',text:'校对结果将展示在这里，每条支持替换与忽略'}));
  function renderResult2(){renderResult();}
  Writing._refreshProof=()=>{renderResult();};
}
function clearMarks(){const ed=window.editor&&editor.el;if(!ed)return;$$('.mark-problem',ed).forEach(m=>{const p=m.parentNode;m.replaceWith(document.createTextNode(m.textContent));p.normalize();});}
function renderMarks(){
  clearMarks();if(!Writing.proofIssues.length)return;
  // 纯文本重建并标注
  const text=editor.getText();
  let html=esc(text);
  // 按长度降序避免嵌套，逐个替换第一处未标注
  const issues=[...Writing.proofIssues].sort((a,b)=>b.old.length-a.old.length);
  const used=new Set();
  issues.forEach((is,i)=>{
    const key=is.old;
    const idx=html.indexOf(esc(key));
    if(idx>=0){html=html.slice(0,idx)+'<span class="mark-problem" data-i="'+i+'">'+esc(key)+'</span>'+html.slice(idx+esc(key).length);}
  });
  editor.el.innerHTML=html.split('\n').map(l=>'<p>'+(l||'<br>')+'</p>').join('');
}
function openRuleDialog(){
  const cfg=new Set(getProofCfg());
  const body=h('div',{});
  function render(){
    body.innerHTML='';
    PROOF_RULES.groups.forEach(g=>{
      const itemKeys=g.items.filter(i=>!i.fixed).map(i=>i.k);
      const all=h('input',{type:'checkbox',checked:itemKeys.every(k=>cfg.has(k))});
      all.addEventListener('change',()=>{itemKeys.forEach(k=>{all.checked?cfg.add(k):cfg.delete(k);render();});});
      const group=h('div',{class:'check-group'},[
        h('div',{class:'check-group-head'},[all,h('span',{text:g.name})]),
        h('div',{class:'check-group-body'},g.items.map(i=>{
          const cb=h('input',{type:'checkbox',checked:cfg.has(i.k),disabled:!!i.fixed});
          cb.addEventListener('change',()=>{cb.checked?cfg.add(i.k):cfg.delete(i.k);render();});
          return h('label',{class:'check-item'+(i.fixed?' fixed':'')},[cb,h('span',{text:i.t+(i.fixed?'（固定）':'')})]);
        }))
      ]);
      body.appendChild(group);
    });
  }
  render();
  openModal({width:560,title:'勾选校对规则',body:[body],footer:[
    h('button',{class:'btn',text:'恢复',onClick:()=>{Writing.proofCfg=null;const d=getProofCfg();cfg.clear();d.forEach(x=>cfg.add(x));render();toast('已恢复默认勾选','info');}}),
    h('button',{class:'btn btn-primary',text:'确定',onClick:()=>{Writing.proofCfg=cfg;closeModal();toast('校对规则已应用','info');}})
  ]});
}

function getConvStore(agentId){ if(!S.chatHistory[agentId])S.chatHistory[agentId]={convs:[],activeId:null};return S.chatHistory[agentId];}
function ChatPage(agentId, opts={}){
  const agent=findAgent(agentId)||findAgent('general');
  touchUsed(agent.id);
  setTopbar(opts.modelSwitch?'小影 AI':agent.name,'企业智体 / 发现更多');
  const view=$('#view');view.innerHTML='';
  const store=getConvStore(agent.id);
  let conv=store.convs.find(c=>c.id===store.activeId)||null;
  let model='Private';
  const stream=h('div',{class:'chat-stream'});
  const convList=h('div',{class:'ch-list'});
  const historyPanel=h('div',{class:'chat-history'},[
    h('div',{class:'ch-head'},[h('button',{class:'btn btn-primary btn-sm',style:{flex:'1'},html:ICON.plus+' 新建对话',onClick:newConv})]),
    convList
  ]);
  function newConv(){conv={id:uid(),title:'新对话',messages:[]};store.convs.unshift(conv);store.activeId=conv.id;saveState();renderHistory();renderStream();const t=composer.querySelector('textarea');t&&t.focus();}
  function renameConv(c){
    const inp=h('input',{class:'input',value:c.title,maxlength:30});
    openModal({width:380,title:'重命名对话',body:[h('div',{class:'field'},[h('div',{class:'field-label',text:'对话名称'}),inp])],footer:[
      h('button',{class:'btn',text:'取消',onClick:closeModal}),
      h('button',{class:'btn btn-primary',text:'保存',onClick:()=>{const v=inp.value.trim();if(!v){toast('名称不能为空','warn');return;}c.title=v;saveState();renderHistory();closeModal();toast('已重命名');}})
    ]});setTimeout(()=>inp.focus(),50);
  }
  async function deleteConv(c){
    const ok=await confirmDialog({title:'删除对话',content:`确定删除对话“${c.title}”吗？删除后不可恢复。`,okText:'删除'});
    if(!ok)return;
    store.convs=store.convs.filter(x=>x.id!==c.id);
    if(conv&&conv.id===c.id){conv=store.convs[0]||null;store.activeId=conv?conv.id:null;}
    saveState();renderHistory();renderStream();toast('已删除对话');
  }
  function renderHistory(){
    convList.innerHTML='';
    if(!store.convs.length)convList.appendChild(h('div',{class:'empty-state fs12',style:{padding:'24px 12px'},text:'暂无历史对话'}));
    store.convs.forEach(c=>{
      const ops=h('div',{class:'ch-ops'},[
        h('button',{title:'重命名',html:ICON.rename,onClick:e=>{e.stopPropagation();renameConv(c);}}),
        h('button',{title:'删除',html:ICON.trash,onClick:e=>{e.stopPropagation();deleteConv(c);}})
      ]);
      convList.appendChild(h('div',{class:'ch-item'+(conv&&c.id===conv.id?' active':''),onClick:()=>{conv=c;store.activeId=c.id;saveState();renderHistory();renderStream();}},[h('span',{class:'ch-title',text:c.title}),ops]));
    });
  }
  function renderStream(){
    stream.innerHTML='';
    const inner=h('div',{class:'chat-stream-inner'});
    if(!conv||!conv.messages.length){
      const intro=opts.modelSwitch
        ? '我是小影AI，可为您提供智能问答与公文创作服务。支持写作、摘要、提纲、翻译、润色等任务，也可结合不同智体人设回答问题。'
        : (agent.opening||agent.intro||agent.persona||'您好，我是您的智能助手。');
      inner.appendChild(h('div',{class:'welcome'},[
        agent.logoData?h('img',{src:agent.logoData,class:'welcome-logo',style:{borderRadius:'18px'}}):h('div',{class:'welcome-logo',style:{background:`linear-gradient(135deg,${(agent.logoColor||agent.color||['#4a80ee','#2557D6'])[0]},${(agent.logoColor||agent.color||['#4a80ee','#2557D6'])[1]})`},text:agent.name.charAt(0)}),
        h('h2',{text:agent.name}),h('p',{text:intro})
      ]));
      if(agent.presets&&agent.presets.filter(Boolean).length){
        const qs=h('div',{class:'pv-presets',style:{justifyContent:'center'}});
        agent.presets.filter(Boolean).slice(0,3).forEach(q=>qs.appendChild(h('button',{text:q,onClick:()=>{ta.value=q;send();}})));
        inner.appendChild(qs);
      }
    }else{
      conv.messages.forEach((m,idx)=>inner.appendChild(msgNode(m,idx)));
    }
    stream.appendChild(inner);stream.scrollTop=stream.scrollHeight;
  }
  function msgNode(m,idx){
    if(m.role==='me') return h('div',{class:'msg me'},[h('div',{class:'ava',text:'我'}),h('div',{},[h('div',{class:'name',text:'我'}),h('div',{class:'msg-row-wrap'},[h('div',{class:'bubble',text:m.text})])])]);
    const color=agent.logoColor||agent.color||['#4a80ee','#2557D6'];
    const bubble=h('div',{class:'bubble',text:m.text||''});
    const ops=h('div',{class:'msg-ops'},[
      h('button',{html:ICON.copy+' 复制',onClick:e=>clipboardCopy(m.text).then(()=>toast('已复制')).catch(()=>toast('复制失败','error'))}),
      h('button',{html:ICON.refresh+' 重新生成',onClick:()=>regenerate(idx)})
    ]);
    return h('div',{class:'msg'},[
      h('div',{class:'ava',style:{background:`linear-gradient(135deg,${color[0]},${color[1]})`},text:agent.name.charAt(0)}),
      h('div',{style:{flex:'1',minWidth:'0'}},[h('div',{class:'name',text:agent.name}),h('div',{class:'msg-row-wrap'},[bubble]),ops])
    ]);
  }
  function regenerate(botIdx){
    if(busy)return;
    // 找到该 bot 消息前最近一条用户消息
    let q='';for(let i=botIdx-1;i>=0;i--){if(conv.messages[i].role==='me'){q=conv.messages[i].text;break;}}
    if(!q)return;
    const aMsg=conv.messages[botIdx];aMsg.text='';renderStream();
    answer(q,aMsg);
  }
  const ta=h('textarea',{rows:'1',placeholder:'输入你的问题或需求（Shift+Enter 换行），支持写作/摘要/提纲/翻译等',onKeydown:e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}},onInput:e=>{e.target.style.height='auto';e.target.style.height=Math.min(140,e.target.scrollHeight)+'px';cnt.textContent=ta.value.length+'/400';}});
  const cnt=h('span',{class:'fs12 c3',text:'0/400'});
  let busy=false,ctrl=null;
  const sendBtn=h('button',{class:'send-btn',html:ICON.send,onClick:send});
  const stopBtn=h('button',{class:'btn btn-danger btn-sm',html:ICON.stop+' 停止生成',style:{display:'none'},onClick:()=>ctrl&&ctrl.stop()});
  function send(){
    const q=ta.value.trim();if(!q||busy)return;ta.value='';ta.style.height='auto';cnt.textContent='0/400';
    if(!conv)newConv();
    if(conv.messages.length===0)conv.title=q.slice(0,18);
    conv.messages.push({role:'me',text:q});
    const aMsg={role:'bot',text:''};conv.messages.push(aMsg);saveState();renderHistory();renderStream();
    answer(q,aMsg);
  }
  function answer(q,aMsg){
    busy=true;sendBtn.style.display='none';stopBtn.style.display='inline-flex';
    const full=AI.chat(q,agent);
    const findBubble=()=>{const nodes=stream.querySelectorAll('.msg');const node=nodes[nodes.length-1];return node?$('.bubble',node):null;};
    let bubble=null;const chSc=makeAutoScroll(stream);
    ctrl=streamText(full,(t,done)=>{aMsg.text=t;if(!bubble)bubble=findBubble();if(bubble)bubble.textContent=t;chSc(done);},{} );
    ctrl.start().then(()=>{busy=false;sendBtn.style.display='flex';stopBtn.style.display='none';saveState();renderStream();});
  }
  const tools=[h('button',{class:'btn btn-sm',html:ICON.history+' 历史记录',onClick:()=>historyPanel.classList.toggle('collapsed')})];
  if(opts.modelSwitch){
    const ms=h('div',{class:'model-switch'},['Private','Cloud'].map(x=>h('button',{class:x==='Private'?'active':'',text:'数据源模型类型 - '+x,onClick:e=>{$$('button',ms).forEach(b=>b.classList.remove('active'));e.target.classList.add('active');model=x;toast('已切换数据源模型类型：'+x,'info');}})));
    tools.push(ms);
  }
  tools.push(h('button',{class:'btn btn-sm',style:{marginLeft:'auto'},html:ICON.plus+' 新建对话',onClick:newConv}),stopBtn);
  const toolbar=h('div',{class:'chat-toolbar'},tools);
  const composer=h('div',{class:'chat-composer'},[h('div',{class:'composer-inner'},[
    h('div',{class:'chat-input-box'},[ta,h('div',{class:'chat-input-foot'},[cnt,sendBtn])])
  ])]);
  const main=h('div',{class:'chat-main'},[toolbar,stream,composer]);
  view.appendChild(h('div',{class:'chat-page',style:{height:'100%'}},[historyPanel,main]));
  renderHistory();renderStream();
}

      const sw=h('input',{type:'checkbox',checked:d.enabled,onChange:e=>{d.enabled=e.target.checked;saveState();toast(d.enabled?'已启用':'已关闭','info');}});

      else statusCell=h('span',{class:'tag tag-red',title:d.failReason||'解析失败',text:'处理失败'});

/* ---------- 添加文档弹窗（真实解析 PDF） ---------- */
function openAddDoc(retryDoc){
  const items=[]; // {id,name,size,file,status:'parsing'|'done'|'fail',reason,text}
  const list=h('div',{style:{maxHeight:'280px',overflowY:'auto'}});
  const fileInput=h('input',{type:'file',accept:'.pdf,application/pdf',multiple:true,style:{display:'none'},onChange:async e=>{
    for(const f of Array.from(e.target.files)){
      if(!/\.pdf$/i.test(f.name)){toast(`“${f.name}”不是 PDF 文件`,'warn');continue;}
      if(f.size>30*1048576){toast(`“${f.name}”超过 30M，无法上传`,'error');continue;}
      if(items.some(x=>x.name===f.name&&x.size===f.size)){toast(`“${f.name}”已在列表中`,'warn');continue;}
      const it={id:uid(),name:f.name,size:f.size,file:f,status:'parsing',text:'',reason:''};items.push(it);renderList();
      try{
        const buf=await f.arrayBuffer();
        const {text}=await PdfExtract.extract(buf);
        const clean=(text||'').replace(/\s/g,'');
        if(clean.length<20){it.status='fail';it.reason='未检测到文本层，可能是扫描件图片 PDF';}
        else{it.status='done';it.text=text;}
      }catch(err){it.status='fail';it.reason='PDF 解析失败，文件可能已损坏或加密';}
      renderList();
    }
    e.target.value='';
  }});
  function statusTag(it){
    if(it.status==='parsing')return h('span',{class:'tag tag-orange'},[h('span',{class:'spinner',style:{width:'11px',height:'11px',marginRight:'5px',display:'inline-block',verticalAlign:'-1px'}}),'解析中']);
    if(it.status==='done')return h('span',{class:'tag tag-green',text:`解析成功 ${it.text.replace(/\s/g,'').length} 字`});
    return h('span',{class:'tag tag-red',title:it.reason,text:'无法识别文字'});
  }
  function renderList(){
    list.innerHTML='';
    if(!items.length)list.appendChild(h('div',{class:'c3 fs12',text:'暂未选择文件'}));
    items.forEach(f=>{
      list.appendChild(h('div',{class:'upload-row'},[
        h('span',{html:ICON.filepdf,style:{color:'var(--danger)'}}),
        h('span',{class:'fname',title:f.reason||f.name,text:f.name+(f.reason?'（'+f.reason+'）':'')}),
        h('span',{class:'c3 fs12',text:fileSize(f.size)}),statusTag(f),
        h('button',{class:'icon-btn',title:'移除',html:ICON.trash,onClick:()=>{items.splice(items.indexOf(f),1);renderList();}})
      ]));
    });
  }
  const ok=h('button',{class:'btn btn-primary',text:'确定添加',onClick:()=>{
    const parsing=items.some(f=>f.status==='parsing');
    if(parsing){toast('文件仍在解析中，请稍候','warn');return;}
    const done=items.filter(f=>f.status==='done');
    if(!done.length){toast('没有可添加的文档（扫描件或解析失败无法入库）','warn');return;}
    done.forEach(f=>S.docs.unshift({id:uid(),name:f.name,size:f.size,type:'文本',status:'success',enabled:true,ct:now(),rawText:f.text}));
    if(retryDoc){S.docs=S.docs.filter(x=>x.id!==retryDoc.id);}
    saveState();closeModal();toast(`已成功添加 ${done.length} 个文档`);
    router();
  }});
  openModal({width:600,title:retryDoc?'重新上传文档':'添加文档',body:[
    h('div',{class:'sys-warn',html:ICON.warn+'<span>支持带文本层的 PDF，单个不超过 30M；文件仅在本地浏览器解析，不会上传服务器。扫描件（纯图片）无法识别文字。</span>'}),
    h('div',{class:'upload-zone',onClick:()=>fileInput.click()},[ICON.upload,h('div',{text:'点击选择本地 PDF 文件（可多选，不超过 30M）'})]),fileInput,
    h('div',{class:'mt12'},list)
  ],footer:[h('button',{class:'btn',text:'取消',onClick:closeModal}),ok]});
  renderList();
}
