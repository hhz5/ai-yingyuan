Views.DocQa=function(params){
  const doc=S.docs.find(d=>d.id===params.id)||S.docs.find(d=>d.status==='success'&&d.rawText);
  setTopbar('文档问答','探文智述 / 文档问答',[h('button',{class:'btn btn-sm',html:ICON.chevL+' 返回文档管理',onClick:()=>go('#/docs')})]);
  const view=$('#view');view.innerHTML='';
  let curDoc=doc;
  const preview=h('div',{class:'doc-preview'});
  function docParas(d){
    const raw=(d.rawText||'').trim();
    if(!raw)return [];
    return raw.split(/\n+/).flatMap(p=>p.split(/(?<=。)/).filter(x=>x.trim()).map(x=>x.trim()));
  }
  function renderPreview(){
    preview.innerHTML='';
    if(!curDoc){preview.appendChild(h('div',{class:'empty-state',html:ICON.doc+'<p>请点击左侧“选择文档”加载文档</p>'}));return;}
    if(!curDoc.rawText){preview.appendChild(h('div',{class:'empty-state',html:ICON.warn+'<p>该文档缺少可识别文本，无法预览与问答，请重新上传电子版 PDF</p>'}));return;}
    preview.appendChild(h('h1',{text:curDoc.name.replace(/\.pdf$/,'')}));
    preview.appendChild(h('div',{class:'doc-meta',text:`文档大小 ${fileSize(curDoc.size)} · 正文 ${curDoc.rawText.replace(/\s/g,'').length} 字 · 创建于 ${fmtTime(curDoc.ct)}`}));
    const paras=docParas(curDoc);
    paras.forEach((t,i)=>{if(i===0||/^[一二三四五六七八九十]+、/.test(t))preview.appendChild(h('h2',{text:t}));else preview.appendChild(h('p',{text:t}));});
  }
  const msgs=[];const msgBox=h('div',{style:{flex:'1',overflowY:'auto',padding:'14px'}});
  function addMsg(role,text){const m={role,text};msgs.push(m);renderMsgs();return m;}
  function renderMsgs(){
    msgBox.innerHTML='';
    if(!msgs.length){msgBox.appendChild(h('div',{class:'field-hint',style:{padding:'8px 4px'},text:'基于所选文档原文提问，例如：这份文件的总体要求是什么？重点任务有哪些？'}));return;}
    msgs.forEach(m=>{
      const body=h('div',{class:'a',style:{whiteSpace:'pre-wrap'},text:m.text});
      const node=h('div',{class:'ai-msg'},[h('div',{class:'q',text:m.role==='me'?'Q：'+m.text:'AI 依据文档回答'}),body]);
      if(m.role==='bot')node.appendChild(h('div',{class:'ops'},[h('button',{class:'btn btn-sm',html:ICON.copy+' 复制',onClick:e=>clipboardCopy(m.text).then(()=>toast('已复制')).catch(()=>toast('复制失败','error'))})]));
      msgBox.appendChild(node);
    });
    msgBox.scrollTop=msgBox.scrollHeight;
  }
  const agentSel=h('select',{class:'select'},[h('option',{value:'general',text:'通用检索问答'})].concat(S.myAgents.filter(a=>a.status==='published').map(a=>h('option',{value:a.id,text:a.name}))));
  const inp=h('textarea',{class:'textarea',rows:3,placeholder:'输入你的问题（Shift+Enter 换行）',onKeydown:e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}});
  function send(){
    const q=inp.value.trim();if(!q)return;
    if(!curDoc){toast('请先选择文档','warn');return;}
    if(!curDoc.rawText){toast('该文档无文本层，无法问答，请更换电子版 PDF','warn');return;}
    inp.value='';addMsg('me',q);
    const wait=addMsg('bot','正在文档中检索相关内容…');
    setTimeout(()=>{
      const full=AI.docAsk(q,curDoc.rawText,findAgent(agentSel.value));
      const dqSc=makeAutoScroll(msgBox);
      streamText(full,(t,done)=>{wait.text=t;const lastBody=msgBox.querySelector('.ai-msg:last-child .a');if(lastBody)lastBody.textContent=t;dqSc(done);if(done)renderMsgs();},{} ).start();
    },400);
  }
  const side=h('div',{class:'doc-side'},[
    h('div',{style:{padding:'14px',borderBottom:'1px solid var(--border)',display:'flex',gap:'8px'}},[
      h('button',{class:'btn btn-primary btn-sm',style:{flex:'1'},text:'选择文档',onClick:openDocList}),
      h('button',{class:'btn btn-sm',title:'清空问答',html:ICON.clear,onClick:()=>{msgs.length=0;renderMsgs();}})
    ]),
    h('div',{style:{padding:'10px 14px',fontSize:'12.5px',color:'var(--text-2)',lineHeight:'1.6'},id:'curDocName'},curDoc?('当前文档：'+curDoc.name):'尚未选择文档'),
    h('div',{class:'field',style:{padding:'0 14px'}},[h('div',{class:'field-label',text:'回答风格（智体）'}),agentSel]),
    msgBox,
    h('div',{style:{padding:'12px 14px',borderTop:'1px solid var(--border)'}},[h('div',{class:'chat-input-box'},[inp,h('div',{class:'chat-input-foot'},[h('button',{class:'btn btn-primary btn-sm',style:{marginLeft:'auto'},html:ICON.send+' 发送',onClick:send})])])])
  ]);
  function openDocList(){
    let kw='',selected=curDoc?curDoc.id:null;
    const listBox=h('div',{});
    function render(){
      listBox.innerHTML='';
      const list=S.docs.filter(d=>d.status==='success'&&(!kw||d.name.toLowerCase().includes(kw.toLowerCase())||(d.rawText||'').toLowerCase().includes(kw.toLowerCase())));
      const tbl=h('table',{class:'data-table'},[
        h('thead',h('tr',[h('th',{style:{width:'40px'}}),h('th',{text:'文件名称'}),h('th',{text:'大小',style:{width:'80px'}}),h('th',{text:'正文字数',style:{width:'90px'}}),h('th',{text:'创建时间',style:{width:'150px'}})])),
        h('tbody')
      ]);
      if(!list.length)$('tbody',tbl).appendChild(h('tr',h('td',{colspan:5},h('div',{class:'empty-state fs12',text:'暂无处理完成的文档'}))));
      list.forEach(d=>{
        const rb=h('input',{type:'radio',name:'pickdoc',checked:d.id===selected,onChange:()=>selected=d.id});
        $('tbody',tbl).appendChild(h('tr',{style:{cursor:'pointer'},onClick:()=>{rb.checked=true;selected=d.id;}},[h('td',rb),h('td',h('div',{class:'fname',title:d.name,text:d.name})),h('td',{text:fileSize(d.size)}),h('td',{class:'fs12 c3',text:(d.rawText||'').replace(/\s/g,'').length+' 字'}),h('td',{class:'c3 fs12',text:fmtDate(d.ct)})]));
      });
      listBox.innerHTML='';listBox.appendChild(tbl);
    }
    openModal({width:700,title:'文档列表',body:[
      h('div',{class:'search-box',style:{width:'100%',marginBottom:'12px'}},[h('span',{html:ICON.search}),h('input',{class:'input',placeholder:'搜索文件名或文件内容',onInput:e=>{kw=e.target.value;render();}})]),
      listBox
    ],footer:[h('button',{class:'btn',text:'取消',onClick:closeModal}),h('button',{class:'btn btn-primary',text:'确定',onClick:()=>{if(!selected){toast('请选择一个文档','warn');return;}curDoc=S.docs.find(d=>d.id===selected);$('#curDocName',side).textContent='当前文档：'+curDoc.name;renderPreview();msgs.length=0;renderMsgs();closeModal();toast('已选择文档','info');}})]});
    render();
  }
  view.appendChild(h('div',{class:'docqa-layout',style:{height:'100%'}},[
    h('div',{class:'doc-preview',style:{flex:'1',overflowY:'auto'}},preview),side
  ]));
  renderPreview();renderMsgs();
};

/* ============================================================
   十四、AI 文档（智能解析：摘要 / 要点 / 大纲 / 关键词）
   ============================================================ */
Views.AiDoc=function(){
  setTopbar('AI 文档','文档智能解析与结构化整理',[
    h('button',{class:'btn btn-sm',html:ICON.upload+' 导入文件',onClick:importFile}),
    h('button',{class:'btn btn-sm',html:ICON.doc+' 从写作区导入',onClick:()=>{if(!S.draft||!S.draft.trim()){toast('写作区暂无内容','warn');return;}ta.value=S.draft;syncCnt();toast('已导入写作区草稿','info');}})
  ]);
  const view=$('#view');view.innerHTML='';
  let result=null,curTab='report';
  const ta=h('textarea',{class:'textarea',style:{width:'100%',minHeight:'340px',resize:'vertical'},placeholder:'将需要分析的文档全文粘贴到此处，也可点击右上角“导入文件”上传 TXT/Markdown/PDF。',onInput:syncCnt});
  const cnt=h('span',{class:'char-count',text:'0 字'});
  function syncCnt(){cnt.textContent=ta.value.replace(/\s/g,'').length+' 字';}
  const fileInput=h('input',{type:'file',accept:'.txt,.md,.markdown,.pdf',style:{display:'none'},onChange:async e=>{
    const f=e.target.files[0];if(!f)return;
    if(f.size>30*1048576){toast('文件超过 30M','error');e.target.value='';return;}
    toast('正在读取文件…','info');
    try{
      let text='';
      if(/\.pdf$/i.test(f.name)){
        const {text:pt}=await PdfExtract.extract(await f.arrayBuffer());
        if(pt.replace(/\s/g,'').length<20){toast('该 PDF 无文本层（疑似扫描件），无法解析','error');e.target.value='';return;}
        text=pt;
      }else text=await f.text();
      ta.value=text;syncCnt();toast('文件导入成功');
    }catch(err){toast('文件读取失败','error');}
    e.target.value='';
  }});
  function importFile(){fileInput.click();}
  const resultBox=h('div',{class:'aidoc-result'});
  const tabs=h('div',{class:'rp-tabs aidoc-tabs'});
  const TABDEFS=[['report','分析报告'],['summary','内容摘要'],['outline','结构大纲'],['points','要点清单'],['keywords','关键词']];
  TABDEFS.forEach(([k,t])=>tabs.appendChild(h('button',{class:'rp-tab',onClick:()=>{curTab=k;markTabs();renderResult();}},t)));
  function markTabs(){$$('.rp-tab',tabs).forEach(b=>b.classList.toggle('active',b.textContent===TABDEFS.find(x=>x[0]===curTab)[1]));}
  function analyze(){
    const text=ta.value.trim();
    if(text.length<30){toast('请先输入不少于 30 字的文档内容','warn');return;}
    result=AI.analyze(text);
    // 保存历史
    S.aiDocHistory.unshift({id:uid(),title:text.split('\n')[0].slice(0,28)||'未命名文档',chars:result.chars,ct:now()});
    if(S.aiDocHistory.length>20)S.aiDocHistory.pop();saveState();
    curTab='report';markTabs();renderResult();toast('分析完成');
  }
  function curResultText(){
    if(!result)return '';
    if(curTab==='summary')return result.summary;
    if(curTab==='outline')return result.outline.map((x,i)=>`${i+1}. ${x}`).join('\n');
    if(curTab==='points')return result.points.join('\n');
    if(curTab==='keywords')return result.keywords.join('、');
    return `【文档分析报告】\n\n一、基本统计\n全文字数 ${result.chars} 字，句子 ${result.sents} 个，段落 ${result.paras} 段，平均句长 ${result.avgLen} 字。可读性评估：${result.read}。\n\n二、内容摘要\n${result.summary}\n\n三、结构大纲\n${result.outline.map((x,i)=>`${i+1}. ${x}`).join('\n')}\n\n四、要点清单\n${result.points.join('\n')}\n\n五、核心关键词\n${result.keywords.join('、')}`;
  }
  function renderResult(){
    resultBox.innerHTML='';
    if(!result){resultBox.appendChild(h('div',{class:'empty-state',html:ICON.analyze+'<p>分析结果将展示在这里</p><p class="fs12 c3">支持一键生成摘要、大纲、要点与关键词</p>'}));return;}
    const ops=h('div',{class:'flex g8',style:{flexWrap:'wrap',margin:'10px 0'}},[
      h('button',{class:'btn btn-sm',html:ICON.copy+' 复制结果',onClick:e=>clipboardCopy(curResultText()).then(()=>toast('已复制')).catch(()=>toast('复制失败','error'))}),
      h('button',{class:'btn btn-sm',html:ICON.filetxt+' 下载 TXT',onClick:()=>{downloadBlob('文档分析结果.txt',curResultText());toast('已下载');}}),
      h('button',{class:'btn btn-sm',html:ICON.arrowR+' 结果导入写作区',onClick:()=>{S.draft=curResultText();saveState();go('#/writing');toast('已导入 AI 写作编辑器','info');}})
    ]);
    let body;
    if(curTab==='report'){
      body=h('div',{},[
        statGrid(result),
        h('h4',{text:'内容摘要'}),h('p',{class:'aidoc-p',text:result.summary}),
        h('h4',{text:'结构大纲'}),h('ol',{class:'aidoc-ol'},result.outline.map(x=>h('li',{text:x}))),
        h('h4',{text:'要点清单'}),h('ol',{class:'aidoc-ol'},result.points.map(x=>h('li',{text:x.replace(/^\d+\.\s*/,'')}))),
        h('h4',{text:'核心关键词'}),h('div',{class:'kw-cloud'},result.keywords.map(k=>h('span',{class:'tag tag-gray',text:k})))
      ]);
    }else if(curTab==='keywords'){
      body=h('div',{class:'kw-cloud lg'},result.keywords.map(k=>h('span',{class:'tag tag-gray',text:k})));
    }else if(curTab==='outline'){
      body=h('ol',{class:'aidoc-ol'},result.outline.map(x=>h('li',{text:x})));
    }else if(curTab==='points'){
      body=h('ol',{class:'aidoc-ol'},result.points.map(x=>h('li',{text:x.replace(/^\d+\.\s*/,'')})));
    }else body=h('p',{class:'aidoc-p',text:result.summary});
    resultBox.append(ops,body);
  }
  function statGrid(r){
    const cell=(n,l)=>h('div',{class:'stat-cell'},[h('b',{text:String(n)}),h('span',{text:l})]);
    return h('div',{class:'stat-grid'},[cell(r.chars,'总字数'),cell(r.sents,'句子数'),cell(r.paras,'段落数'),cell(r.avgLen,'平均句长')]);
  }
  const sample=h('button',{class:'btn btn-sm',html:ICON.refresh+' 载入示例文档',onClick:()=>{ta.value='今年以来，我县坚持把优化营商环境作为推动高质量发展的重要抓手，持续深化“放管服”改革。一是推进政务服务提质增效，全县政务服务事项全程网办率达到百分之八十六，企业开办时间压缩至一个工作日以内。二是落实惠企政策直达快享，累计为市场主体减税降费若干亿元，惠及企业三千余家。三是健全政企常态化沟通机制，开展“企业服务日”活动，协调解决企业诉求两百余件。同时也要看到，我县营商环境仍存在一些短板：部分事项审批环节仍然偏多，基层窗口业务能力参差不齐，中小微企业融资难融资贵问题尚未根本缓解。下一步，我县将聚焦企业全生命周期服务，持续精简审批流程，加强数字赋能，强化要素保障，健全督查问效机制，以一流营商环境护航经济社会高质量发展。';syncCnt();}});
  const left=h('div',{class:'card aidoc-input'},[
    h('div',{class:'section-head',style:{marginBottom:'10px'}},[h('h3',{text:'原始文档'}),sample]),
    ta,h('div',{class:'flex aic',style:{marginTop:'8px'}},[cnt,h('button',{class:'btn btn-sm',style:{marginLeft:'auto'},text:'清空',onClick:()=>{ta.value='';result=null;syncCnt();renderResult();}})]),
    h('div',{class:'flex g8 mt12'},[
      h('button',{class:'btn btn-primary',style:{flex:1},html:ICON.analyze+' 一键智能分析',onClick:analyze}),
      h('button',{class:'btn',html:ICON.spark+' 仅生成摘要',onClick:()=>{if(ta.value.trim().length<30){toast('内容过短','warn');return;}result=AI.analyze(ta.value.trim());curTab='summary';markTabs();renderResult();}})
    ])
  ]);
  const right=h('div',{class:'card aidoc-right'},[tabs,resultBox]);
  view.appendChild(h('div',{class:'page aidoc-page'},[left,right]));
  markTabs();renderResult();syncCnt();
};

/* ============================================================
   十五、公文范文库（分类 / 搜索 / 详情 / 一键套用）
   ============================================================ */
const tplCache=new Map();
Views.Templates=function(){
  setTopbar('公文范文','规范范文浏览与一键套用',[]);
  const view=$('#view');view.innerHTML='';
  let cat='全部',kw='';
  const grid=h('div',{class:'tpl-grid'});
  const pills=h('div',{class:'radio-pills'},TEMPLATE_CATS.map(c=>h('button',{class:'pill'+(c==='全部'?' active':''),text:c,onClick:e=>{cat=c;$$('.pill',pills).forEach(x=>x.classList.remove('active'));e.target.classList.add('active');render();}})));
  const search=h('div',{class:'search-box',style:{width:'280px'}},[h('span',{html:ICON.search}),h('input',{class:'input',placeholder:'搜索范文标题或关键词',onInput:e=>{kw=e.target.value.trim().toLowerCase();render();}})]);
  function render(){
    grid.innerHTML='';
    const list=TEMPLATES.filter(t=>(cat==='全部'||t.cat===cat)&&(!kw||t.name.toLowerCase().includes(kw)||t.intro.toLowerCase().includes(kw)||(t.kws||[]).some(k=>k.toLowerCase().includes(kw))));
    if(!list.length){grid.appendChild(h('div',{class:'empty-state',style:{gridColumn:'1/-1'},html:ICON.book+'<p>未找到匹配范文</p>'}));return;}
    list.forEach(t=>grid.appendChild(h('div',{class:'card tpl-card'},[
      h('div',{class:'tpl-card-head'},[h('span',{class:'tag tag-gray',text:t.cat}),h('span',{class:'fs12 c3',text:t.artCat})]),
      h('h4',{text:t.name}),h('p',{text:t.intro}),
      h('div',{class:'tpl-kws'},(t.kws||[]).map(k=>h('span',{text:'# '+k}))),
      h('div',{class:'flex g8 mt12'},[
        h('button',{class:'btn btn-sm btn-primary',style:{flex:1},html:ICON.book+' 查看范文',onClick:()=>openTplDetail(t)}),
        h('button',{class:'btn btn-sm',html:ICON.arrowR+' 直接套用',onClick:()=>useTemplate(t)})
      ])
    ])));
  }
  view.appendChild(h('div',{class:'page'},[
    h('div',{class:'sys-warn',style:{background:'var(--primary-light)',color:'var(--primary)',marginBottom:'16px'},html:ICON.info+'<span>范文按党政公文规范结构组织，点击“查看范文”可在线阅读完整正文，支持一键载入 AI 写作编辑器继续修改、导出。</span>'}),
    h('div',{class:'table-toolbar'},[pills,h('span',{style:{marginLeft:'auto'}}),search]),
    grid
  ]));
  render();
};
function buildTplText(t){
  if(tplCache.has(t.name))return tplCache.get(t.name);
  const text=AI.article({cat:t.artCat,type:t.cat,scene:t.scene,title:t.name,length:'中',kws:t.kws||[],supp:[]});
  tplCache.set(t.name,text);return text;
}
function openTplDetail(t){
  const body=h('div',{});
  const foot=h('div',{class:'flex g8'},[
    h('button',{class:'btn',html:ICON.copy+' 复制全文',onClick:e=>clipboardCopy(buildTplText(t)).then(()=>toast('已复制')).catch(()=>toast('复制失败','error'))}),
    h('button',{class:'btn',html:ICON.filetxt+' 下载',onClick:()=>{downloadBlob(t.name+'.txt',buildTplText(t));toast('已下载');}}),
    h('button',{class:'btn btn-primary',style:{marginLeft:'auto'},html:ICON.arrowR+' 一键套用至写作',onClick:()=>{useTemplate(t);closeModal();}})
  ]);
  const m=openModal({width:760,title:t.name,body:[body],footer:[foot],customClass:'tpl-modal'});
  body.appendChild(h('div',{class:'flex aic g8 mb12'},[h('span',{class:'tag tag-gray',text:t.cat}),h('span',{class:'c3 fs12',text:t.intro}),h('span',{class:'dots-loading',style:{marginLeft:'auto'},html:'<i></i><i></i><i></i>'})]));
  setTimeout(()=>{
    const text=buildTplText(t);
    body.innerHTML='';
    const lines=text.split('\n');
    const reader=h('div',{class:'tpl-reader'});
    lines.forEach((l,i)=>{if(i===0)reader.appendChild(h('h1',{text:l}));else if(/^[一二三四五六七八九十]+、|导语|结语/.test(l))reader.appendChild(h('h2',{text:l}));else reader.appendChild(h('p',{text:l}));});
    body.appendChild(reader);
  },500);
}
function useTemplate(t){
  const text=buildTplText(t);
  S.draft=text;saveState();go('#/writing');toast('已载入范文全文，可在编辑器中继续修改');
}

/* ============================================================
   十五、初始化
   ============================================================ */
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&activeModal)closeModal(); });
// 阻止编辑器中的粘贴带来外部样式，统一纯文本
document.addEventListener('paste',e=>{
  const ed=e.target&&e.target.closest&&e.target.closest('#editor');
  if(ed){e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t);}
},true);
loadState();
if(!location.hash) location.hash='#/center';
router();

</script>
