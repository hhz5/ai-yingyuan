name: merge-index
on:
  push:
    paths:
      - 'src_parts/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge parts into single-file index.html
        run: |
          cat src_parts/p*.txt > index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ci: merge src_parts into index.html [skip ci]" || echo "nothing to commit"
          git push
