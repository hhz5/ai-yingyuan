name: merge-index
on:
  push:
    paths:
      - 'parts_final/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge parts into single-file index.html and clean legacy shards
        run: |
          set -e
          cat parts_final/p*.txt > index.html
          rm -rf src_parts parts
          sha256sum index.html > SHA256SUMS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: merge parts_final into index.html [skip ci]" || echo "nothing to commit"
          git push
